name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  tests:
    name: Unit, CLI, and TCP integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run all Cargo tests
        run: cargo test --all-features
      - name: Smoke-test release benchmark runner
        run: >-
          cargo run --release --bin rustydb-benchmark --
          --workload mixed
          --operations 100
          --value-size 64
          --concurrency 2

  ctrl_c:
    name: Ctrl+C process test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build RustyDB
        run: cargo build --bin rustydb
      - name: Test graceful Ctrl+C shutdown
        run: python3 scripts/test_ctrl_c.py target/debug/rustydb

  redis_cli:
    name: redis-cli RESP2/RESP3 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install redis-cli
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools
      - name: Run redis-cli smoke test
        run: python3 scripts/redis_cli_smoke.py

  coverage:
    name: Per-module coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --json --output-path coverage.json
      - name: Require more than 70% coverage per module
        run: python3 scripts/check_module_coverage.py coverage.json --threshold 70
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json

  ci-success:
    name: CI Success
    if: always()
    needs:
      - quality
      - tests
      - ctrl_c
      - redis_cli
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CTRL_C_RESULT: ${{ needs.ctrl_c.result }}
          REDIS_CLI_RESULT: ${{ needs.redis_cli.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TESTS_RESULT" = "success"
          test "$CTRL_C_RESULT" = "success"
          test "$REDIS_CLI_RESULT" = "success"
          test "$COVERAGE_RESULT" = "success"
          echo "CI Success: true"
