name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test, and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --json --output-path coverage.json

      - name: Require more than 70% coverage per module
        run: python3 scripts/check_module_coverage.py coverage.json --threshold 70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json

  ci-success:
    name: CI Success
    if: always()
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: CI Success
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          echo "CI Success: true"
