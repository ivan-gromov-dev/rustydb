[package]
name = "rustydb"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "A small in-memory key-value database written in Rust."
license = "MIT"
repository = "https://github.com/Djunichi/rustydb"
readme = "README.md"
keywords = ["database", "key-value", "in-memory", "redis", "learning"]
categories = ["database-implementations", "command-line-utilities"]
exclude = ["scripts/__pycache__/"]

[dependencies]
ctrlc = "3.5.2"
